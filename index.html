<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyatnicya grup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; border-radius: 12px; }
        .btn-xl { padding: 18px; font-size: 1.3rem; width: 100%; font-weight: bold; border-radius: 10px; }
        .search-box { border: 2px solid #0d6efd; border-radius: 8px; padding: 12px; font-size: 1.1rem; }
        #reportTable { width: 100%; border-collapse: collapse; background: white; font-family: 'Courier New', monospace; font-size: 14px; }
        #reportTable th, #reportTable td { border: 1px solid #000; padding: 6px; }
        .history-sale { color: #dc3545; font-weight: bold; }
        .history-supply { color: #198754; font-weight: bold; }
        .print-header { display: none; }
        
        #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
        #main-app { display: none; }

        @media print {
            body * { visibility: hidden; }
            #pills-report, #pills-report * { visibility: visible; }
            #pills-report { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            .print-header { display: flex !important; justify-content: space-between; margin-bottom: 15px; font-weight: bold; }
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">🔐 П'ятниця Груп</h3>
        <div class="mb-3">
            <label>Email закладу:</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="Логін">
        </div>
        <div class="mb-3">
            <label>Пароль:</label>
            <input type="password" id="loginPass" class="form-control" placeholder="Пароль">
        </div>
        <button id="loginBtn" class="btn btn-primary w-100 py-2">УВІЙТИ</button>
    </div>
</div>

<div id="main-app" class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <h2 id="venueTitle">🍺 Bar Manager</h2>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Вийти</button>
    </div>

    <ul class="nav nav-pills mb-3 justify-content-center no-print" id="pills-tab" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-sale">💰 Продаж</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-supply">🚚 Поставка</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-history">📜 Історія</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-report">📄 Звіт</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-add">➕ Товар</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="pills-sale">
            <div class="card p-4">
                <div class="mb-3">
                    <label>🔍 Пошук товару:</label>
                    <input list="productsList" id="saleSearch" class="form-control search-box" placeholder="Почніть вводити назву...">
                    <input type="hidden" id="saleProductId">
                    <small id="saleHint" class="text-primary fw-bold"></small>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Кількість:</label>
                        <div class="input-group">
                            <input type="number" step="0.001" id="saleAmount" class="form-control form-control-lg">
                            <span class="input-group-text" id="saleUnit">од</span>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Акцизний код:</label>
                        <input type="text" id="exciseCode" class="form-control form-control-lg" placeholder="Сканувати...">
                    </div>
                </div>
                <button id="btnProcessSale" class="btn btn-danger btn-xl">ПРОДАТИ</button>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-supply">
            <div class="card p-4">
                <div class="mb-3">
                    <label>🔍 Товар для поставки:</label>
                    <input list="productsList" id="supplySearch" class="form-control search-box">
                    <input type="hidden" id="supplyProductId">
                </div>
                <div class="mb-3">
                    <label>Кількість:</label>
                    <div class="input-group">
                        <input type="number" step="0.001" id="supplyAmount" class="form-control form-control-lg">
                        <span class="input-group-text" id="supplyUnit">од</span>
                    </div>
                </div>
                <button id="btnProcessSupply" class="btn btn-success btn-xl">ДОДАТИ НА СКЛАД</button>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-history">
            <div class="card p-3">
                <div class="table-responsive">
                    <table class="table table-sm table-hover">
                        <thead><tr><th>Час</th><th>Дія</th><th>Товар</th><th>К-сть</th><th>Акциз</th></tr></thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-report">
            <div class="d-flex justify-content-between mb-3 no-print">
                <h4>Залишки на складі</h4>
                <button onclick="window.print()" class="btn btn-primary">🖨️ Друк звіту</button>
            </div>
            <div class="print-header">
                <span id="printVenueName">заклад</span>
                <span id="reportDate"></span>
            </div>
            <table id="reportTable">
                <thead><tr><th>Код</th><th>Назва</th><th>Од.</th><th>Залишок</th><th class="no-print">Дії</th></tr></thead>
                <tbody id="reportBody"></tbody>
            </table>
        </div>

        <div class="tab-pane fade" id="pills-add">
            <div class="card p-4">
                <div class="row">
                    <div class="col-md-6 mb-2"><label>Код:</label><input type="text" id="newCode" class="form-control"></div>
                    <div class="col-md-6 mb-2"><label>Назва:</label><input type="text" id="newName" class="form-control"></div>
                </div>
                <div class="row mb-2">
                    <div class="col-6"><label>Одиниця:</label><select id="newUnit" class="form-select"><option value="л">Літри</option><option value="шт">Штуки</option></select></div>
                    <div class="col-6"><label>Порція:</label><input type="number" step="0.001" id="newDefaultPortion" class="form-control" value="0.5"></div>
                </div>
                <div class="mb-3"><label>Початковий залишок:</label><input type="number" step="0.001" id="newStartQty" class="form-control" value="0"></div>
                <button id="btnAddNew" class="btn btn-dark w-100 py-3">ЗБЕРЕГТИ ТОВАР</button>
            </div>
        </div>
    </div>
</div>

<datalist id="productsList"></datalist>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ВАШ КОНФІГ FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyCJN7Kq"+"O8IspyiaASFW_"+"Pjx0qOHBerZgNs",
        authDomain: "barmen-2dc9a.firebaseapp.com",
        projectId: "barmen-2dc9a",
        storageBucket: "barmen-2dc9a.firebasestorage.app",
        messagingSenderId: "498"+"386875489",
        appId: "1:498386875"+"489:web:df2b395"+"329240a6a542620"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentVenue = "";
    let allProducts = [];
    let unsubProducts, unsubLogs;

    // --- ГАРНІ ПОВІДОМЛЕННЯ (TOAST) ---
    const showToast = (message, icon = 'success') => {
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2500,
            timerProgressBar: true
        });
        Toast.fire({ icon: icon, title: message });
    };

    // --- АВТОРИЗАЦІЯ ---
    document.getElementById('loginBtn').onclick = () => {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        signInWithEmailAndPassword(auth, email, pass)
            .then(() => showToast("Вхід успішний!"))
            .catch(e => Swal.fire("Помилка входу", "Невірний email або пароль", "error"));
    };

    document.getElementById('logoutBtn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentVenue = user.email.split('@')[0].toUpperCase();
            document.getElementById('venueTitle').innerText = `П'ятниця Груп | ${currentVenue}`;
            document.getElementById('printVenueName').innerText = currentVenue;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            startSystem();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-app').style.display = 'none';
            if (unsubProducts) unsubProducts();
            if (unsubLogs) unsubLogs();
        }
    });

    function startSystem() {
        const productsCol = collection(db, `products_${currentVenue}`);
        const logsCol = collection(db, `logs_${currentVenue}`);

        unsubProducts = onSnapshot(productsCol, (snapshot) => {
            allProducts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            updateInterface();
        });

        unsubLogs = onSnapshot(query(logsCol, orderBy("timestamp", "desc"), limit(50)), (snap) => {
            const hb = document.getElementById('historyBody');
            hb.innerHTML = '';
            snap.forEach(d => {
                const data = d.data();
                const date = data.timestamp ? data.timestamp.toDate().toLocaleString('uk-UA', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '...';
                hb.innerHTML += `<tr><td>${date}</td><td>${data.type === 'sale' ? '<span class="history-sale">Продаж</span>' : '<span class="history-supply">Поставка</span>'}</td><td>${data.productName}</td><td>${data.amount}</td><td><small>${data.exciseCode}</small></td></tr>`;
            });
        });

        document.getElementById('btnProcessSale').onclick = () => processTransaction('sale', productsCol, logsCol);
        document.getElementById('btnProcessSupply').onclick = () => processTransaction('supply', productsCol, logsCol);
        document.getElementById('btnAddNew').onclick = () => addNewProduct(productsCol);
    }

    function updateInterface() {
        const datalist = document.getElementById('productsList');
        const reportBody = document.getElementById('reportBody');
        datalist.innerHTML = ''; reportBody.innerHTML = '';
        
        allProducts.sort((a,b) => b.quantity - a.quantity).forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name;
            datalist.appendChild(opt);

            reportBody.innerHTML += `<tr><td>${p.code || '-'}</td><td>${p.name}</td><td>${p.unit}</td><td><b>${p.quantity.toFixed(3)}</b></td><td class="no-print"><button class="btn btn-sm btn-outline-danger" onclick="confirmDelete('${p.id}', '${p.name}')">🗑️</button></td></tr>`;
        });
    }

    // Пошук товару
    const setupSearch = (type) => {
        document.getElementById(type + 'Search').oninput = (e) => {
            const product = allProducts.find(p => p.name === e.target.value);
            if (product) {
                document.getElementById(type + 'ProductId').value = product.id;
                document.getElementById(type + 'Unit').innerText = product.unit;
                if (type === 'sale') {
                    document.getElementById('saleAmount').value = product.defaultPortion;
                    document.getElementById('saleHint').innerText = `Залишок: ${product.quantity.toFixed(3)} ${product.unit}`;
                }
            }
        };
    };
    setupSearch('sale'); setupSearch('supply');

    async function processTransaction(type, pCol, lCol) {
        const id = document.getElementById(type + 'ProductId').value;
        const amount = parseFloat(document.getElementById(type + 'Amount').value);
        if (!id || isNaN(amount)) return Swal.fire("Увага", "Оберіть товар зі списку!", "warning");

        const product = allProducts.find(p => p.id === id);
        const newQty = (product.quantity || 0) + (type === 'sale' ? -amount : amount);

        try {
            await updateDoc(doc(db, `products_${currentVenue}`, id), { quantity: newQty });
            await addDoc(lCol, { productName: product.name, type, amount, exciseCode: document.getElementById('exciseCode')?.value || "N/A", timestamp: serverTimestamp() });
            
            showToast(type === 'sale' ? "Продано успішно" : "Склад оновлено");
            document.getElementById(type + 'Search').value = "";
            document.getElementById(type + 'Amount').value = "";
            if (type === 'sale') document.getElementById('exciseCode').value = "";
        } catch (e) {
            Swal.fire("Помилка", e.message, "error");
        }
    }

    async function addNewProduct(pCol) {
        const name = document.getElementById('newName').value;
        const portion = parseFloat(document.getElementById('newDefaultPortion').value);
        if (!name || isNaN(portion)) return Swal.fire("Помилка", "Заповніть назву та порцію", "error");

        try {
            await addDoc(pCol, { 
                name, 
                code: document.getElementById('newCode').value, 
                unit: document.getElementById('newUnit').value, 
                defaultPortion: portion, 
                quantity: parseFloat(document.getElementById('newStartQty').value) || 0 
            });
            showToast("Товар додано в базу");
            document.getElementById('newName').value = "";
            document.getElementById('newCode').value = "";
        } catch (e) {
            Swal.fire("Помилка", e.message, "error");
        }
    }

    window.confirmDelete = (id, name) => {
        Swal.fire({
            title: 'Видалити товар?',
            text: `Ви впевнені, що хочете видалити "${name}"?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Так, видалити!',
            cancelButtonText: 'Скасувати'
        }).then(async (result) => {
            if (result.isConfirmed) {
                await deleteDoc(doc(db, `products_${currentVenue}`, id));
                showToast("Товар видалено", "info");
            }
        });
    };

    document.getElementById('reportDate').innerText = new Date().toLocaleDateString('uk-UA');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
